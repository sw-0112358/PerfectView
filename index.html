      /* =============================================
         NHENTAI
      ============================================= */

      const NH_CDN = ['i3', 'i1', 'i2'];

      async function nhListar() {
        const db = await bvAbrirDB();
        return new Promise((resolve, reject) => {
          const req = db.transaction('nh_galerias', 'readonly')
          .objectStore('nh_galerias').getAll();
          req.onsuccess = e => resolve(e.target.result);
          req.onerror   = e => reject(e.target.error);
        });
      }

      async function nhGuardar(info) {
        const db = await bvAbrirDB();
        return new Promise((resolve, reject) => {
          const tx  = db.transaction('nh_galerias', 'readwrite');
          const req = tx.objectStore('nh_galerias')
          .add({ ...info, fecha: new Date().toISOString(), zip_id: null });
          tx.oncomplete = () => resolve(req.result);
          tx.onerror    = e => reject(e.target.error);
        });
      }

      async function nhEliminarDB(id) {
        const db = await bvAbrirDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('nh_galerias', 'readwrite');
          tx.objectStore('nh_galerias').delete(id);
          tx.oncomplete = () => resolve();
          tx.onerror    = e => reject(e.target.error);
        });
      }

      async function nhActualizarZip(id, zip_id) {
        const db = await bvAbrirDB();
        return new Promise((resolve, reject) => {
          const tx  = db.transaction('nh_galerias', 'readwrite');
          const req = tx.objectStore('nh_galerias').get(id);
          req.onsuccess = e => {
            const reg = e.target.result;
            if (!reg) { reject(new Error('No encontrado')); return; }
            reg.zip_id = zip_id;
            tx.objectStore('nh_galerias').put(reg);
          };
          tx.oncomplete = () => resolve();
          tx.onerror    = e => reject(e.target.error);
        });
      }

      // — Fetch info desde la página del lector (JSON embebido por SvelteKit) —
      async function nhFetchInfo(nhId) {
        if (!CF_WORKER) throw new Error('Configura el Worker primero');
        // El lector /g/ID/1/ embebe el JSON completo de la galería en un script tag
        const readerUrl = 'https://nhentai.net/g/' + nhId + '/1/';
        const resp = await fetch(
          CF_WORKER.replace(/\/$/, '') + '/fetch-html?target=' + encodeURIComponent(readerUrl)
        );
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const html = await resp.text();

        // Extraer el JSON embebido: <script type="application/json" data-sveltekit-fetched ...>
        // Buscar el script tag que contiene la data de la galería (data-url con /api/v2/galleries/)
        const matches = [...html.matchAll(/<script type="application\/json" data-sveltekit-fetched[^>]*data-url="([^"]*)"[^>]*>([\s\S]*?)<\/script>/g)];

        let data = null;
        for (const m of matches) {
          const dataUrl = m[1];
          if (!dataUrl.includes('galleries')) continue;
          try {
            const fetched = JSON.parse(m[2]);
            const body    = typeof fetched.body === 'string' ? JSON.parse(fetched.body) : fetched.body;
            if (body && body.media_id) { data = body; break; }
          } catch(e) {}
        }

        if (!data) {
          // Debug: copiar todos los data-url encontrados
          const urls = matches.map(m => m[1]);
          navigator.clipboard.writeText(JSON.stringify(urls)).catch(() => {});
          throw new Error('No se encontró data de la galería — URLs copiadas al portapapeles (' + matches.length + ' scripts encontrados)');
        }

        return {
          nh_id:     String(data.id),
          media_id:  String(data.media_id),
          nombre:    (data.title?.english || data.title?.pretty || 'Sin título').slice(0, 80),
          num_pages: data.num_pages,
          paths:     data.pages.map(p => p.path), // "galleries/4004782/1.webp"
        };
      }

      // — Descargar todas las páginas usando paths exactos —
      function nhConstruirEntradas(galeria) {
        const entradas = [];
        for (let i = 0; i < galeria.num_pages; i++) {
          const path = galeria.paths
          ? galeria.paths[i]
          : 'galleries/' + galeria.media_id + '/' + (i + 1) + '.webp';
          const ext = path.split('.').pop() || 'webp';
          entradas.push({
            nombre: String(i + 1).padStart(3, '0') + '.' + ext,
            url:    'https://' + NH_CDN[0] + '.nhentai.net/' + path
          });
        }
        return entradas;
      }

      async function nhDescargarPaginas(entradas, onProgreso, slotId = null) {
        return await batchDescargar(entradas, {
          'Referer':         'https://nhentai.net/',
          'User-Agent':      'Mozilla/5.0 (Linux; Android 10; Mobile) AppleWebKit/537.36 Chrome/120.0 Safari/537.36',
          'Accept':          'image/webp,image/apng,image/*,*/*;q=0.8',
          'Accept-Language': 'es-ES,es;q=0.9',
        }, onProgreso, false, slotId, 1500);
      }

      // — Abrir galería descargada en visor —
      async function nhAbrirEnVisor(galeria, cardEl = null) {
        if (!galeria.zip_id) { nhDescargarGaleria(galeria, cardEl); return; }
        actualizarStatus('⏳ Cargando…');
        const imagenes = await cargarDesdeSlotOZip('nh-' + galeria.id, galeria.zip_id);
        if (!imagenes) { actualizarStatus('❌ ZIP no encontrado'); return; }
        archivosDescargados.length = 0;
        imagenes.forEach(a => archivosDescargados.push(a));
        const todasNh = await nhListar();
        todasNh.sort((a,b) => b.fecha.localeCompare(a.fecha));
        _visorContexto = { tipo: 'nhentai', galeria, galerias: todasNh };
        mostrarVisor(true);
        mostrarImagenesEnVisor();
        actualizarStatus('✅ ' + imagenes.length + ' páginas');
      }

      // — Descargar galería completa y guardar —
      // — Descargar galería completa y guardar —
      async function nhDescargarGaleria(galeria, cardEl) {
        const ph     = cardEl?.querySelector('.bv-cover-placeholder');
        const img    = cardEl?.querySelector('.bv-cover-img');
        const setPh  = t => { if (ph) ph.textContent = t; };
        const slotId = 'nh-' + galeria.id;

        setPh('⏳');

        // Construir entradas UNA sola vez desde los paths guardados
        const todasEntradas = nhConstruirEntradas(galeria);

        // Verificar slot previo
        const slotPrevio = await dtCargar(slotId);
        if (slotPrevio && slotPrevio.imagenes.length > 0) {
          actualizarStatus('⏳ Reanudando: ' + galeria.nombre + ' · ' + slotPrevio.imagenes.length + '/' + todasEntradas.length);
          try {
            const nombresYa    = new Set(slotPrevio.imagenes.map(a => a.nombre));
            const entradasPend = todasEntradas.filter(e => !nombresYa.has(e.nombre));
            const nuevas = entradasPend.length > 0
            ? await nhDescargarPaginas(entradasPend, (n, t) => {
              const total = slotPrevio.imagenes.length + n;
              setPh('⏳ ' + total + '/' + todasEntradas.length);
              actualizarStatus('⏳ NH · ' + total + '/' + todasEntradas.length);
            }, slotId)
            : [];
            const archivos = [...slotPrevio.imagenes, ...nuevas]
            .sort((a, b) => a.nombre.localeCompare(b.nombre, undefined, { numeric: true }));
            if (archivos.length < todasEntradas.length) {
              actualizarStatus('⚠️ Solo ' + archivos.length + '/' + todasEntradas.length + ' — reintentando al reabrir');
              setPh('⬇️');
              return;
            }
            setPh('📦');
            actualizarStatus('⏳ Creando ZIP…');
            const zip = new JSZip();
            archivos.forEach(a => zip.file(a.nombre, a.blob));
            const zipBlob = await zip.generateAsync({ type: 'blob' });
            const zipId   = await bvGuardar(galeria.nombre + '.zip', zipBlob, 'nhentai');
            await nhActualizarZip(galeria.id, zipId);
            if (archivos[0]) bvGuardarPortada(zipId, archivos[0].blob).catch(() => {});
            await dtEliminar(slotId);
            galeria.zip_id = zipId;
            if (cardEl) {
              if (img && archivos[0]) {
                img.src = URL.createObjectURL(archivos[0].blob);
                img.style.display = 'block';
                ph.style.display  = 'none';
              }
              cardEl.onclick = () => nhAbrirEnVisor(galeria);
            }
            actualizarStatus('✅ ' + galeria.nombre + ' completado — toca para ver');
          } catch(err) {
            setPh('⬇️');
            actualizarStatus('❌ NH reanudación: ' + err.message);
          }
          return;
        }

        try {
          await dtCrear(slotId, { categoria: 'nhentai', nombre: galeria.nombre, total: todasEntradas.length });
          const archivos = await nhDescargarPaginas(todasEntradas, (p, t) => {
            setPh('⏳ ' + p + '/' + t);
            actualizarStatus('⏳ NH · ' + p + '/' + t);
          }, slotId);
          if (!archivos.length) throw new Error('No se descargó ninguna imagen');
          if (archivos.length < todasEntradas.length) {
            actualizarStatus('⚠️ Solo ' + archivos.length + '/' + todasEntradas.length + ' — reintentando al reabrir');
            setPh('⬇️');
            return;

          setPh('📦');
          actualizarStatus('⏳ Creando ZIP…');
          const zip = new JSZip();
          archivos.forEach(a => zip.file(a.nombre, a.blob));

          const zipId   = await bvGuardar(galeria.nombre + '.zip', zipBlob, 'nhentai');
          await nhActualizarZip(galeria.id, zipId);
          if (archivos[0]) bvGuardarPortada(zipId, archivos[0].blob).catch(() => {});
          // No eliminar slot — se reutiliza en el visor

          if (cardEl) {

              img.src = URL.createObjectURL(archivos[0].blob);

              ph.style.display  = 'none';

            cardEl.onclick = () => nhAbrirEnVisor(galeria);

          actualizarStatus('✅ ' + galeria.nombre + ' listo — toca para ver');
        } catch(err) {
          setPh('⬇️');
          actualizarStatus('❌ NH: ' + err.message);
        }
      }

      async function bvExtraerPortada(zipBlob) {
        const zip = await JSZip.loadAsync(zipBlob);
        const imagenes = Object.values(zip.files)
        .filter(f => !f.dir && /\.(jpe?g|png|webp|gif)$/i.test(f.name))
        .sort((a,b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
        if (!imagenes.length) return null;
        return await imagenes[0].async('blob');
      }

      let _sjzColeccionActual = null; // null = lista de mangas, object = capítulos

      // — CRUD IndexedDB —
      async function sjzListar() {
        const db = await bvAbrirDB();
        return new Promise((resolve, reject) => {
          const req = db.transaction('sjz_colecciones', 'readonly')
          .objectStore('sjz_colecciones').getAll();

          req.onerror   = e => reject(e.target.error);
        });

      async function sjzGuardar(nombre, base_url, capitulos) {
        const db = await bvAbrirDB();
        return new Promise((resolve, reject) => {
          const tx  = db.transaction('sjz_colecciones', 'readwrite');
          const req = tx.objectStore('sjz_colecciones')
          .add({ nombre, base_url, capitulos, fecha: new Date().toISOString() });

      async function sjzEliminarDB(id) {
        const db = await bvAbrirDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('sjz_colecciones', 'readwrite');
          tx.objectStore('sjz_colecciones').delete(id);
          tx.oncomplete = () => resolve();
          tx.onerror    = e => reject(e.target.error);

      // — Obtener capítulos vía fetch —
      async function sjzVerEpisodios() {
        const url   = document.getElementById('sjzUrl').value.trim();
        const info  = document.getElementById('sjzInfo');
        if (!url || !/^https?:\/\//i.test(url)) { info.textContent = '⚠️ Ingresa una URL válida'; return; }
        if (!CF_WORKER) { info.textContent = '⚠️ Configura el Worker primero'; return; }
        info.textContent = '⏳ Buscando…';
        try {
          const base = CF_WORKER.replace(/\/$/, '');
          const html = await fetch(base + '/raw?target=' + encodeURIComponent(url)).then(r => r.text());

          // Intentar admin-ajax con el data-id del manga
          const matchId = html.match(/id="manga-chapters-holder"[^>]*data-id="(\d+)"/);
          let maxCap = 0;

          if (matchId) {
            const mangaId  = matchId[1];
            const ajaxUrl  = new URL(url).origin + '/wp-admin/admin-ajax.php';
            try {
              const ajaxHtml = await fetch(base + '/raw?target=' + encodeURIComponent(ajaxUrl), {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'action=manga_get_chapters&manga=' + mangaId
              }).then(r => r.text());
              const nums = [...ajaxHtml.matchAll(/capitulo-(\d+)/gi)].map(m => parseInt(m[1]));
              if (nums.length) maxCap = Math.max(...nums);
            } catch(e) {}
          }

          // Fallback: parsear capítulos visibles en el HTML de la página
          if (!maxCap) {
            const slug = url.replace(/\/$/, '').split('/').pop();
            const re   = new RegExp(slug + '\\/capitulo-(\\d+)', 'gi');
            const nums = [...html.matchAll(re)].map(m => parseInt(m[1]));
            if (nums.length) maxCap = Math.max(...nums);
          }

          if (!maxCap) { info.textContent = '⚠️ No se detectaron capítulos — ingrésalos manualmente'; return; }

          document.getElementById('sjzFinal').value = maxCap;
          if (!document.getElementById('sjzInicio').value) document.getElementById('sjzInicio').value = 1;
          info.textContent = '✅ Capítulos detectados: ' + maxCap;
        } catch(err) {
          info.textContent = '❌ ' + err.message;
        }
      }

      // — Crear carpeta de capítulos —
      async function sjzCrearCarpeta() {
        const url    = document.getElementById('sjzUrl').value.trim();
        const inicio = parseInt(document.getElementById('sjzInicio').value);
        const final  = parseInt(document.getElementById('sjzFinal').value);
        const info   = document.getElementById('sjzInfo');

        if (!url || !/^https?:\/\//i.test(url)) { info.textContent = '⚠️ URL inválida'; return; }
        if (!inicio || !final || inicio > final)  { info.textContent = '⚠️ Rango inválido'; return; }

        // Extraer nombre desde el slug
        const slug   = url.replace(/\/$/, '').split('/').pop();
        const nombre = slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        const base   = url.endsWith('/') ? url : url + '/';

        const capitulos = [];
        for (let i = inicio; i <= final; i++) {
          capitulos.push({ num: i, url: base + 'capitulo-' + i + '/' });
        }

        try {
          const existentes = await sjzListar();
          const yaExiste   = existentes.find(c => c.base_url === base);
          if (yaExiste) { info.textContent = '⚠️ Esta colección ya existe en la bóveda'; return; }
          await sjzGuardar(nombre, base, capitulos);
          info.textContent = '✅ Carpeta "' + nombre + '" creada con ' + capitulos.length + ' capítulos';
          document.getElementById('sjzUrl').value   = '';
          document.getElementById('sjzInicio').value = '';
          document.getElementById('sjzFinal').value  = '';
          renderSamurai(document.getElementById('bvLista'));
        } catch(err) {
          info.textContent = '❌ ' + err.message;
        }
      }

      // — Actualizar colección en IndexedDB —
      async function sjzActualizarColeccion(id, capitulos) {
        const db = await bvAbrirDB();
        return new Promise((resolve, reject) => {
          const tx  = db.transaction('sjz_colecciones', 'readwrite');
          const req = tx.objectStore('sjz_colecciones').get(id);
          req.onsuccess = e => {
            const reg = e.target.result;
            if (!reg) { reject(new Error('No encontrado')); return; }
            reg.capitulos = capitulos;
            tx.objectStore('sjz_colecciones').put(reg);
          };
          tx.oncomplete = () => resolve();
          tx.onerror    = e => reject(e.target.error);
        });
      }

      // — Buscar nuevos episodios —
      async function sjzBuscarNuevos() {
        if (!_sjzColeccionActual) return;
        if (!CF_WORKER) { actualizarStatus('⚠️ Configura el Worker primero'); return; }

        actualizarStatus('🔄 Buscando nuevos episodios…');
        try {
          const base      = CF_WORKER.replace(/\/$/, '');
          const url       = _sjzColeccionActual.base_url;
          const html      = await fetch(base + '/raw?target=' + encodeURIComponent(url)).then(r => r.text());
          let maxSitio    = 0;

          // Intentar admin-ajax
          const matchId = html.match(/id="manga-chapters-holder"[^>]*data-id="(\d+)"/);
          if (matchId) {
            const ajaxUrl  = new URL(url).origin + '/wp-admin/admin-ajax.php';
            try {
              const ajaxHtml = await fetch(base + '/raw?target=' + encodeURIComponent(ajaxUrl), {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'action=manga_get_chapters&manga=' + matchId[1]
              }).then(r => r.text());
              const nums = [...ajaxHtml.matchAll(/capitulo-(\d+)/gi)].map(m => parseInt(m[1]));
              if (nums.length) maxSitio = Math.max(...nums);
            } catch(e) {}
          }

          // Fallback: parsear desde HTML visible
          if (!maxSitio) {
            const slug = url.replace(/\/$/, '').split('/').pop();
            const re   = new RegExp(slug + '\\/capitulo-(\\d+)', 'gi');
            const nums = [...html.matchAll(re)].map(m => parseInt(m[1]));
            if (nums.length) maxSitio = Math.max(...nums);
          }

          if (!maxSitio) { actualizarStatus('⚠️ No se pudo detectar el total de episodios'); return; }

          const caps        = _sjzColeccionActual.capitulos;
          const maxLocal    = Math.max(...caps.map(c => c.num));
          const nuevosNums  = [];
          for (let i = maxLocal + 1; i <= maxSitio; i++) nuevosNums.push(i);

          if (!nuevosNums.length) {
            actualizarStatus('✅ Todo al día — último episodio: ' + maxLocal);
            return;
          }

          if (!confirm('🆕 Hay ' + nuevosNums.length + ' episodio(s) nuevo(s) (del ' + nuevosNums[0] + ' al ' + nuevosNums[nuevosNums.length - 1] + ').\n¿Agregar a la colección?')) return;

          const nuevasCaps = [
            ...caps,
            ...nuevosNums.map(n => ({ num: n, url: _sjzColeccionActual.base_url + 'capitulo-' + n + '/' }))
          ];

          await sjzActualizarColeccion(_sjzColeccionActual.id, nuevasCaps);
          _sjzColeccionActual.capitulos = nuevasCaps;
          actualizarStatus('✅ ' + nuevosNums.length + ' episodios agregados');
          renderBoveda();

        } catch(err) {
          actualizarStatus('❌ ' + err.message);
        }
      }

      // — Extraer URLs de imágenes de una página de capítulo —
      function sjzExtraerImagenes(html) {
        const urls = [];
        const imgRegex = /<img[^>]+class="wp-manga-chapter-img"[^>]*>/gi;
        for (const match of html.matchAll(imgRegex)) {
          const srcMatch = match[0].match(/src="([^"]+)"/i);
          if (srcMatch) urls.push(srcMatch[1].trim());
        }
        return urls;
      }

      // — Guardar capítulo descargado en zips store con metadatos SJZ —
      async function sjzGuardarCapitulo(nombre, blob, coleccion_id, cap_num) {
        const db = await bvAbrirDB();
        return new Promise((resolve, reject) => {
          const tx  = db.transaction('zips', 'readwrite');
          const req = tx.objectStore('zips').add({
            nombre, fecha: new Date().toISOString(),
            tamaño: blob.size, blob,
            categoria: 'samurai',
            sjz_coleccion_id: coleccion_id,
            sjz_cap_num: cap_num
          });
          tx.oncomplete = () => resolve(req.result);
          tx.onerror    = e => reject(e.target.error);
          tx.onabort    = e => reject(e.target.error);
        });
      }

      // — Buscar ZIP de un capítulo concreto —
      async function sjzBuscarZipCapitulo(coleccion_id, cap_num) {
        const db = await bvAbrirDB();
        return new Promise((resolve, reject) => {
          const req = db.transaction('zips', 'readonly').objectStore('zips').getAll();
          req.onsuccess = e => {
            const found = e.target.result.find(
              r => r.sjz_coleccion_id === coleccion_id && r.sjz_cap_num === cap_num
            );
            resolve(found || null);
          };
          req.onerror = e => reject(e.target.error);
        });
      }

      // — Mapa de capítulos descargados para una colección —
      async function sjzListarDescargados(coleccion_id) {
        const db = await bvAbrirDB();
        return new Promise((resolve, reject) => {
          const req = db.transaction('zips', 'readonly').objectStore('zips').getAll();
          req.onsuccess = e => {
            const mapa = {};
            e.target.result
              .filter(r => r.sjz_coleccion_id === coleccion_id)
              .forEach(r => { mapa[r.sjz_cap_num] = r.id; });
            resolve(mapa);
          };
          req.onerror = e => reject(e.target.error);
        });
      }

      // — Abrir capítulo: descarga o carga desde DB —
      async function sjzAbrirCapitulo(coleccion, cap, chipEl) {
        // Ya descargado → cargar directo desde IndexedDB
        const existente = await sjzBuscarZipCapitulo(coleccion.id, cap.num);
        if (existente) {
          actualizarStatus('⏳ Cargando cap. ' + cap.num + '…');
          const zip      = await JSZip.loadAsync(existente.blob);
          const entradas = Object.values(zip.files)
          .filter(f => !f.dir)
          .sort((a,b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
          archivosDescargados.length = 0;
          for (const e of entradas) {
            archivosDescargados.push({ nombre: e.name, blob: await e.async('blob') });
          }
          _visorContexto = { tipo: 'samurai', coleccion, capNum: cap.num };
          bvNavegar('pantalla1');
          mostrarImagenesEnVisor();
          actualizarStatus('✅ Cap. ' + cap.num + ' — ' + entradas.length + ' imágenes');
          return;
        }

        // No descargado → descargar
        if (!CF_WORKER) { actualizarStatus('⚠️ Configura el Worker primero'); return; }

        const slotId = 'sjz-' + coleccion.id + '-' + cap.num;

        // Verificar si hay descarga previa interrumpida
        const slotPrevio = await dtCargar(slotId);
        if (slotPrevio && slotPrevio.imagenes.length > 0) {
          chipEl.classList.add('descargando');
          actualizarStatus('⏳ Reanudando cap. ' + cap.num + ' · ' + slotPrevio.imagenes.length + ' ya descargadas…');
          try {
            const base     = CF_WORKER.replace(/\/$/, '');
            const html     = await fetch(base + '/raw?target=' + encodeURIComponent(cap.url)).then(r => r.text());
            const imageUrls = sjzExtraerImagenes(html);
            if (!imageUrls.length) throw new Error('No se encontraron imágenes');

            // Nombres ya descargados
            const nombresYaDescargados = new Set(slotPrevio.imagenes.map(a => a.nombre));

            // Entradas pendientes — las que aún no están en el slot
            const todasEntradas = imageUrls.map((imgUrl, i) => ({
              nombre: String(i).padStart(3, '0') + '.' + (imgUrl.split('.').pop().split('?')[0] || 'jpg').toLowerCase(),
              url:    imgUrl
            }));
            const entradasPendientes = todasEntradas.filter(e => !nombresYaDescargados.has(e.nombre));

            actualizarStatus('⏳ Cap.' + cap.num + ' · reanudando ' + entradasPendientes.length + ' restantes…');

            // Descargar solo las pendientes
            const nuevas = entradasPendientes.length > 0
            ? await batchDescargar(entradasPendientes, null, (n, t) => {
              const prog = (slotPrevio.imagenes.length + n) + '/' + todasEntradas.length;
              actualizarStatus('⏳ Cap.' + cap.num + ' · ' + prog);
              chipEl.textContent = prog;
            }, false, slotId)
            : [];

            // Combinar previas + nuevas y ordenar por nombre
            const archivos = [...slotPrevio.imagenes, ...nuevas]
            .sort((a, b) => a.nombre.localeCompare(b.nombre, undefined, { numeric: true }));

            // Crear ZIP y guardar
            const zip = new JSZip();
            archivos.forEach(a => zip.file(a.nombre, a.blob));
            const zipBlob = await zip.generateAsync({ type: 'blob' });
            const zipId   = await sjzGuardarCapitulo(
              coleccion.nombre + ' - Cap ' + cap.num + '.zip',
              zipBlob, coleccion.id, cap.num
            );
            if (archivos.length) bvGuardarPortada(zipId, archivos[0].blob).catch(() => {});
            await dtEliminar(slotId);
            chipEl.classList.remove('descargando');
            chipEl.classList.add('descargado');
            chipEl.title = '✅ Descargado — tap para abrir';
            actualizarStatus('✅ Cap. ' + cap.num + ' completado — ' + archivos.length + ' imágenes');
          } catch(err) {
            chipEl.classList.remove('descargando');
            actualizarStatus('❌ Error al reanudar: ' + err.message);
          }
          return;
        }

        chipEl.classList.add('descargando');
        actualizarStatus('⏳ Descargando cap. ' + cap.num + '…');

        try {
          const base = CF_WORKER.replace(/\/$/, '');

          // 1. Fetch página del episodio
          const html      = await fetch(base + '/raw?target=' + encodeURIComponent(cap.url)).then(r => r.text());
          const imageUrls = sjzExtraerImagenes(html);
          if (!imageUrls.length) throw new Error('No se encontraron imágenes');

          // 2. Crear slot temporal
          const entradas = imageUrls.map((imgUrl, i) => ({
            nombre: String(i).padStart(3, '0') + '.' + (imgUrl.split('.').pop().split('?')[0] || 'jpg').toLowerCase(),
            url:    imgUrl
          }));
          await dtCrear(slotId, { categoria: 'samurai', nombre: coleccion.nombre + ' - Cap ' + cap.num, total: entradas.length });

          // 3. Descargar imágenes via batch con persistencia
          const archivos = await batchDescargar(entradas, null, (n, t) => {
            const prog = n + '/' + t;
            actualizarStatus('⏳ Cap.' + cap.num + ' · ' + prog);
            chipEl.textContent = prog;
          }, false, slotId);

          // 3. Crear ZIP
          const zip = new JSZip();
          archivos.forEach(a => zip.file(a.nombre, a.blob));
          const zipBlob = await zip.generateAsync({ type: 'blob' });

          // 4. Guardar en IndexedDB
          const zipId = await sjzGuardarCapitulo(
            coleccion.nombre + ' - Cap ' + cap.num + '.zip',
            zipBlob, coleccion.id, cap.num
          );

          // 5. Guardar portada
          if (archivos.length) bvGuardarPortada(zipId, archivos[0].blob).catch(() => {});

          // 6. Marcar chip como descargado
          chipEl.classList.remove('descargando');
          chipEl.classList.add('descargado');
          chipEl.title = '✅ Descargado';

          // 7. Marcar como descargado — sin navegar automáticamente
          await dtEliminar(slotId);
          chipEl.classList.remove('descargando');
          chipEl.classList.add('descargado');
          chipEl.title = '✅ Descargado — tap para abrir';
          actualizarStatus('✅ Cap. ' + cap.num + ' listo — toca para ver');

        } catch(err) {
          chipEl.classList.remove('descargando');
          actualizarStatus('❌ Cap. ' + cap.num + ': ' + err.message);
          // No eliminar slot — preservar progreso para reanudar
        }
      }

      let _sjzOrdenDesc = true; // true = más reciente primero

      // — Exportar colección completa como ZIP maestro —
      async function sjzExportarZipCompleto(col) {
        const descargados = await sjzListarDescargados(col.id);
        const capsDesc    = Object.keys(descargados).map(Number).sort((a,b) => a-b);
        if (!capsDesc.length) {
          actualizarStatus('⚠️ No hay capítulos descargados en "' + col.nombre + '"');
          return;
        }
        if (!confirm('📦 Exportar "' + col.nombre + '" con ' + capsDesc.length + ' capítulo(s) descargado(s)?\n\nEsto puede tardar varios minutos según el tamaño.')) return;

        actualizarStatus('⏳ Preparando exportación…');
        try {
          const masterZip = new JSZip();

          // JSON de la colección
          const metaJson = {
            version:    1,
            tipo:       'samurai',
            nombre:     col.nombre,
            base_url:   col.base_url,
            fecha:      col.fecha,
            total_caps: col.capitulos.length,
            capitulos:  col.capitulos.map(c => ({
              num:        c.num,
              url:        c.url,
              descargado: !!descargados[c.num],
            })),
          };
          masterZip.file('coleccion.json', JSON.stringify(metaJson, null, 2));

          // Agregar ZIPs de capítulos descargados
          for (let i = 0; i < capsDesc.length; i++) {
            const capNum = capsDesc[i];
            const zipId  = descargados[capNum];
            actualizarStatus('⏳ Empacando cap. ' + capNum + ' (' + (i+1) + '/' + capsDesc.length + ')…');
            const reg = await bvCargar(zipId);
            if (!reg) continue;
            const nombre = 'cap_' + String(capNum).padStart(4, '0') + '.zip';
            masterZip.file(nombre, reg.blob);
          }

          actualizarStatus('⏳ Generando ZIP maestro…');
          const masterBlob = await masterZip.generateAsync({ type: 'blob' }, meta => {
            actualizarStatus('⏳ Comprimiendo… ' + Math.round(meta.percent) + '%');
          });

          const url = URL.createObjectURL(masterBlob);
          const a   = document.createElement('a');
          a.href    = url;
          a.download = col.nombre.replace(/[^a-zA-Z0-9\-_\s]/g, '') + '.zip';
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 5000);
          actualizarStatus('✅ Exportado: ' + capsDesc.length + ' capítulos');
        } catch(err) {
          actualizarStatus('❌ ' + err.message);
        }
      }

      let _mwColeccionActual = null;

      // — CRUD IndexedDB —
      async function mwListar() {
        const db = await bvAbrirDB();
        return new Promise((resolve, reject) => {
          const req = db.transaction('mw_colecciones', 'readonly')
          .objectStore('mw_colecciones').getAll();
          req.onsuccess = e => resolve(e.target.result);
          req.onerror   = e => reject(e.target.error);
        });
      }

      async function mwGuardar(nombre, base_url, slug, capitulos) {
        const db = await bvAbrirDB();
        return new Promise((resolve, reject) => {
          const tx  = db.transaction('mw_colecciones', 'readwrite');
          const req = tx.objectStore('mw_colecciones')
          .add({ nombre, base_url, slug, capitulos, fecha: new Date().toISOString() });
          tx.oncomplete = () => resolve(req.result);
          tx.onerror    = e => reject(e.target.error);
        });
      }

      async function mwEliminarDB(id) {
        const db = await bvAbrirDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('mw_colecciones', 'readwrite');
          tx.objectStore('mw_colecciones').delete(id);
          tx.oncomplete = () => resolve();
          tx.onerror    = e => reject(e.target.error);
        });
      }

      async function mwActualizarColeccion(id, capitulos) {
        const db = await bvAbrirDB();
        return new Promise((resolve, reject) => {
          const tx  = db.transaction('mw_colecciones', 'readwrite');
          const req = tx.objectStore('mw_colecciones').get(id);
          req.onsuccess = e => {
            const reg = e.target.result;
            if (!reg) { reject(new Error('No encontrado')); return; }
            reg.capitulos = capitulos;
            tx.objectStore('mw_colecciones').put(reg);
          };
          tx.oncomplete = () => resolve();
          tx.onerror    = e => reject(e.target.error);
        });
      }

      // — ZIP de capítulo Manhwa en store zips —
      async function mwGuardarCapitulo(nombre, blob, coleccion_id, cap_num) {
        const db = await bvAbrirDB();
        return new Promise((resolve, reject) => {
          const tx  = db.transaction('zips', 'readwrite');
          const req = tx.objectStore('zips').add({
            nombre, fecha: new Date().toISOString(),
            tamaño: blob.size, blob,
            categoria: 'manhwa',
            mw_coleccion_id: coleccion_id,
            mw_cap_num: cap_num
          });
          tx.oncomplete = () => resolve(req.result);
          tx.onerror    = e => reject(e.target.error);
          tx.onabort    = e => reject(e.target.error);
        });
      }

      async function mwBuscarZipCapitulo(coleccion_id, cap_num) {
        const db = await bvAbrirDB();
        return new Promise((resolve, reject) => {
          const req = db.transaction('zips', 'readonly').objectStore('zips').getAll();
          req.onsuccess = e => {
            const found = e.target.result.find(
              r => r.mw_coleccion_id === coleccion_id && r.mw_cap_num === cap_num
            );
            resolve(found || null);
          };
          req.onerror = e => reject(e.target.error);
        });
      }

      async function mwListarDescargados(coleccion_id) {
        const db = await bvAbrirDB();
        return new Promise((resolve, reject) => {
          const req = db.transaction('zips', 'readonly').objectStore('zips').getAll();
          req.onsuccess = e => {
            const mapa = {};
            e.target.result
              .filter(r => r.mw_coleccion_id === coleccion_id)
              .forEach(r => { mapa[r.mw_cap_num] = r.id; });
            resolve(mapa);
          };
          req.onerror = e => reject(e.target.error);
        });
      }

      // — Detectar episodios desde la página del manhwa —
      async function mwVerEpisodios() {
        const url  = document.getElementById('mwUrl').value.trim();
        const info = document.getElementById('mwInfo');
        if (!url || !/^https?:\/\//i.test(url)) { info.textContent = '⚠️ URL inválida'; return; }
        if (!CF_WORKER) { info.textContent = '⚠️ Configura el Worker primero'; return; }
        info.textContent = '⏳ Buscando episodios…';
        try {
          const slug = url.replace(/\/$/, '').split('/').pop();
          const base = CF_WORKER.replace(/\/$/, '');
          const html = await fetch(base + '/raw?target=' + encodeURIComponent(url)).then(r => r.text());
          const esc  = slug.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const nums = [...html.matchAll(new RegExp(esc + '-(\\d+)_', 'gi'))].map(m => parseInt(m[1]));
          if (!nums.length) { info.textContent = '⚠️ No detectado — ingresa el total manualmente'; return; }
          const maxCap = Math.max(...nums);
          document.getElementById('mwFinal').value  = maxCap;
          if (!document.getElementById('mwInicio').value) document.getElementById('mwInicio').value = 1;
          info.textContent = '✅ Episodios detectados: ' + maxCap;
        } catch(err) { info.textContent = '❌ ' + err.message; }
      }

      // — Crear carpeta Manhwa —
      async function mwCrearCarpeta() {
        const url    = document.getElementById('mwUrl').value.trim();
        const inicio = parseInt(document.getElementById('mwInicio').value);
        const final  = parseInt(document.getElementById('mwFinal').value);
        const info   = document.getElementById('mwInfo');
        if (!url || !/^https?:\/\//i.test(url)) { info.textContent = '⚠️ URL inválida'; return; }
        if (!inicio || !final || inicio > final)  { info.textContent = '⚠️ Rango inválido'; return; }
        const slug       = decodeURIComponent(url.replace(/\/$/, '').split('/').pop());
        const tituloSlug = slug.replace(/_\d{10,}$/, '');
        const nombre     = tituloSlug.replace(/_/g, ' ').replace(/-/g, ' ').trim().replace(/\b\w/g, c => c.toUpperCase());
        const caps   = [];
        for (let i = inicio; i <= final; i++) caps.push({ num: i });
        try {
          const existentes = await mwListar();
          const yaExiste   = existentes.find(c => c.base_url === url);
          if (yaExiste) { info.textContent = '⚠️ Esta colección ya existe en la bóveda'; return; }
          await mwGuardar(nombre, url, slug, caps);
          info.textContent = '✅ "' + nombre + '" creado con ' + caps.length + ' episodios';
          document.getElementById('mwUrl').value    = '';

      async function batchDescargar(entradas, headers, onProgreso, stopOn404 = false, slotId = null) {
        if (!CF_WORKER) throw new Error('Worker no configurado');
        const referer  = headers ? (headers['Referer'] || headers['referer'] || '') : '';
        const archivos = [];

        for (let i = 0; i < entradas.length; i++) {
          const { nombre, url } = entradas[i];
          const blob = await proxyImagen(url, referer);
          if (!blob) {
            if (stopOn404) break;
            actualizarStatus('⚠️ ' + nombre + ': no disponible');
            continue;
          }
          archivos.push({ nombre, blob });
          if (slotId) dtAgregarImagen(slotId, { nombre, blob }).catch(() => {});
          if (onProgreso) onProgreso(archivos.length, entradas.length);
        }
        return archivos;
      }

      async function proxyImagen(url, referer) {
        if (!CF_WORKER) return null;
        const endpoint = CF_WORKER.replace(/\/$/, '') + '/proxy-img?target='
        + encodeURIComponent(url) + '&referer=' + encodeURIComponent(referer);
        try {
          const resp = await fetch(endpoint);
          if (!resp.ok) return null;
          const blob = await resp.blob();
          if (blob.size < 500) return null;
          if (blob.type && !blob.type.startsWith('image/')) return null;
          return blob;
        } catch(e) { return null; }
      }

      // — Auto-descubrir CDN y extensión —
      async function mwDescubrirCDN(slug, capNum) {
        const cdns = ['1', '2', '3', '4', '5'];
        const exts = ['jpg', 'webp', 'png', 'jpeg'];
        for (const cdn of cdns) {
          for (const ext of exts) {
            const url  = 'https://img' + cdn + 'mw.xyz/manhwas/' + slug
            + '/chapter_' + capNum + '/ver_01/001.' + ext;
            const blob = await proxyImagen(url, 'https://manhwaweb.com/');
            if (blob) return { cdn, ext, primerBlob: blob };
          }
        }
        return null;
      }

      // — Descargar imágenes del CDN —
      async function mwDescargarImagenes(slug, capNum, onProgreso, slotId = null) {
        actualizarStatus('🔍 Detectando CDN para cap. ' + capNum + '…');
        const desc = await mwDescubrirCDN(slug, capNum);
        if (!desc) throw new Error('No se encontró CDN — verifica el slug o el episodio');

        const { cdn, ext } = desc;
        const imgBase = 'https://img' + cdn + 'mw.xyz/manhwas/' + slug
        + '/chapter_' + capNum + '/ver_01/';

        // Pre-construir lista hasta 300 — el Worker detiene al fallar
        const entradas = [];
        for (let i = 1; i <= 300; i++) {
          entradas.push({
            nombre: String(i).padStart(3, '0') + '.' + ext,
            url:    imgBase + String(i).padStart(3, '0') + '.' + ext
          });
        }

        return await batchDescargar(entradas, {
          'Referer':         'https://manhwaweb.com/',
          'User-Agent':      'Mozilla/5.0 (Linux; Android 10; Mobile) AppleWebKit/537.36 Chrome/120.0 Safari/537.36',
          'Accept':          'image/webp,image/apng,image/*,*/*;q=0.8',
          'Accept-Language': 'es-ES,es;q=0.9',
        }, onProgreso, true, slotId);
      }


      // — Abrir capítulo Manhwa —
      async function mwAbrirCapitulo(coleccion, cap, chipEl) {
        const existente = await mwBuscarZipCapitulo(coleccion.id, cap.num);
        if (existente) {
          actualizarStatus('⏳ Cargando cap. ' + cap.num + '…');
          const zip      = await JSZip.loadAsync(existente.blob);
          const entradas = Object.values(zip.files)
          .filter(f => !f.dir)
          .sort((a,b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
          archivosDescargados.length = 0;
          for (const e of entradas) archivosDescargados.push({ nombre: e.name, blob: await e.async('blob') });
          _visorContexto = { tipo: 'manhwa', coleccion, capNum: cap.num };
          bvNavegar('pantalla1');
          mostrarImagenesEnVisor();
          actualizarStatus('✅ Cap. ' + cap.num + ' — ' + entradas.length + ' imágenes');
          return;
        }
        if (!CF_WORKER) { actualizarStatus('⚠️ Configura el Worker primero'); return; }

        const slotId = 'mw-' + coleccion.id + '-' + cap.num;

        // Verificar slot previo
        const slotPrevio = await dtCargar(slotId);
        if (slotPrevio && slotPrevio.imagenes.length > 0) {
          chipEl.classList.add('descargando');
          actualizarStatus('⏳ Reanudando cap. ' + cap.num + ' · ' + slotPrevio.imagenes.length + ' ya descargadas…');
          try {
            // Redescubrir CDN — puede haber cambiado
            const desc = await mwDescubrirCDN(coleccion.slug, cap.num);
            if (!desc) throw new Error('No se encontró CDN');
            const { cdn, ext } = desc;
            const imgBase = 'https://img' + cdn + 'mw.xyz/manhwas/' + coleccion.slug + '/chapter_' + cap.num + '/ver_01/';
            const todasEntradas = [];
            for (let i = 1; i <= 300; i++) {
              todasEntradas.push({ nombre: String(i).padStart(3, '0') + '.' + ext, url: imgBase + String(i).padStart(3, '0') + '.' + ext });
            }
            const nombresYa    = new Set(slotPrevio.imagenes.map(a => a.nombre));
            const entradasPend = todasEntradas.filter(e => !nombresYa.has(e.nombre));
            const nuevas = entradasPend.length > 0
            ? await batchDescargar(entradasPend, {
              'Referer': 'https://manhwaweb.com/',
              'User-Agent': 'Mozilla/5.0 (Linux; Android 10; Mobile) AppleWebKit/537.36 Chrome/120.0 Safari/537.36',
              'Accept': 'image/webp,image/apng,image/*,*/*;q=0.8',
              'Accept-Language': 'es-ES,es;q=0.9',
            }, n => {
              actualizarStatus('⏳ Cap.' + cap.num + ' · ' + (slotPrevio.imagenes.length + n));
              chipEl.textContent = slotPrevio.imagenes.length + n;
            }, true, slotId)
            : [];
            const archivos = [...slotPrevio.imagenes, ...nuevas]
            .sort((a, b) => a.nombre.localeCompare(b.nombre, undefined, { numeric: true }));
            actualizarStatus('⏳ Creando ZIP…');
            const zip = new JSZip();
            archivos.forEach(a => zip.file(a.nombre, a.blob));
            const zipBlob = await zip.generateAsync({ type: 'blob' });
            const zipId   = await mwGuardarCapitulo(coleccion.nombre + ' - Cap ' + cap.num + '.zip', zipBlob, coleccion.id, cap.num);
            if (archivos[0]) bvGuardarPortada(zipId, archivos[0].blob).catch(() => {});
            await dtEliminar(slotId);
            chipEl.classList.remove('descargando');
            chipEl.classList.add('descargado');
            chipEl.title = '✅ Descargado — tap para abrir';
            actualizarStatus('✅ Cap. ' + cap.num + ' completado — ' + archivos.length + ' imágenes');
          } catch(err) {
            chipEl.classList.remove('descargando');
            actualizarStatus('❌ Cap. ' + cap.num + ': ' + err.message);
          }
          return;
        }

        chipEl.classList.add('descargando');
        try {
          await dtCrear(slotId, { categoria: 'manhwa', nombre: coleccion.nombre + ' - Cap ' + cap.num, total: 0 });
          const archivos = await mwDescargarImagenes(coleccion.slug, cap.num, n => {
            actualizarStatus('⏳ Cap.' + cap.num + ' · imagen ' + n);
            chipEl.textContent = n;
          }, slotId);
          if (!archivos.length) throw new Error('Sin imágenes — verifica que el Worker tenga el endpoint /proxy-img');
          actualizarStatus('⏳ Creando ZIP…');
          const zip = new JSZip();
          archivos.forEach(a => zip.file(a.nombre, a.blob));
          const zipBlob = await zip.generateAsync({ type: 'blob' });
          const zipId   = await mwGuardarCapitulo(coleccion.nombre + ' - Cap ' + cap.num + '.zip', zipBlob, coleccion.id, cap.num);
          if (archivos.length) bvGuardarPortada(zipId, archivos[0].blob).catch(() => {});
          await dtEliminar(slotId);
          chipEl.classList.remove('descargando');
          chipEl.classList.add('descargado');
          chipEl.title = '✅ Descargado — tap para abrir';
          actualizarStatus('✅ Cap. ' + cap.num + ' listo — toca para ver');
        } catch(err) {
          chipEl.classList.remove('descargando');
          actualizarStatus('❌ Cap. ' + cap.num + ': ' + err.message);
        }
      }

      // — Buscar nuevos episodios Manhwa —
      async function mwBuscarNuevos() {
        if (!_mwColeccionActual || !CF_WORKER) return;
        actualizarStatus('🔄 Buscando nuevos episodios…');
        try {
          const base = CF_WORKER.replace(/\/$/, '');
          const html = await fetch(base + '/raw?target=' + encodeURIComponent(_mwColeccionActual.base_url)).then(r => r.text());
          const slug = _mwColeccionActual.slug;
          const esc  = slug.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const nums = [...html.matchAll(new RegExp(esc + '-(\\d+)_', 'gi'))].map(m => parseInt(m[1]));
          if (!nums.length) { actualizarStatus('⚠️ No se pudo detectar el total'); return; }
          const maxSitio = Math.max(...nums);
          const caps     = _mwColeccionActual.capitulos;
          const maxLocal = Math.max(...caps.map(c => c.num));
          if (maxSitio <= maxLocal) { actualizarStatus('✅ Todo al día — último: ' + maxLocal); return; }
          const nuevos = [];
          for (let i = maxLocal + 1; i <= maxSitio; i++) nuevos.push(i);
          if (!confirm('🆕 ' + nuevos.length + ' episodio(s) nuevo(s) (del ' + nuevos[0] + ' al ' + nuevos[nuevos.length-1] + ').\n¿Agregar?')) return;
          const nuevasCaps = [...caps, ...nuevos.map(n => ({ num: n }))];
          await mwActualizarColeccion(_mwColeccionActual.id, nuevasCaps);
          _mwColeccionActual.capitulos = nuevasCaps;
          actualizarStatus('✅ ' + nuevos.length + ' episodios agregados');
          renderBoveda();
        } catch(err) { actualizarStatus('❌ ' + err.message); }
      }

      // — Agregar episodios manualmente —
      async function mwAgregarEpisodios() {
        if (!_mwColeccionActual) return;
        const caps     = _mwColeccionActual.capitulos;
        const maxLocal = Math.max(...caps.map(c => c.num));
        const input    = prompt('➕ Último episodio disponible actualmente:\n(ahora tienes hasta el ' + maxLocal + ')', maxLocal + 1);
        if (input === null) return;
        const nuevoMax = parseInt(input);
        if (isNaN(nuevoMax) || nuevoMax <= maxLocal) {
          actualizarStatus('⚠️ El número debe ser mayor a ' + maxLocal);
          return;
        }
        const nuevas = [];
        for (let i = maxLocal + 1; i <= nuevoMax; i++) nuevas.push({ num: i });
        const nuevasCaps = [...caps, ...nuevas];
        await mwActualizarColeccion(_mwColeccionActual.id, nuevasCaps);
        _mwColeccionActual.capitulos = nuevasCaps;
        actualizarStatus('✅ ' + nuevas.length + ' episodios agregados — hasta el ' + nuevoMax);
        renderBoveda();
      }

          items = await bvListar(categoriaActual);
        } catch(err) {
          contenedor.innerHTML += '<div class="bv-empty">❌ Error al leer la bóveda</div>';
          return;
        }
        if (!items.length) {
          contenedor.innerHTML += '<div class="bv-empty">' + (carpeta ? carpeta.icon : '📁') + ' Carpeta vacía<br><span style="font-size:.8rem">Agrega tu primer manga</span></div>';
          return;
        }

        const grid = document.createElement('div');
        grid.className = 'bv-grid';
        contenedor.appendChild(grid);


        items.sort((a,b) => b.fecha.localeCompare(a.fecha));

        for (const item of items) {
          const { card, ph: placeholder, img, footer } = crearTarjeta({
            nombre:      item.nombre.replace(/\.zip$/i, ''),
            phTexto:     '📖',
            onRenombrar: (footerEl) => bvRenombrar(item, footerEl),
            onDelete:    (btnEl, cardEl, footerEl) => bvAbrirDropdown(btnEl, item, cardEl, footerEl),
            btnMenu:     '···',
          });

          // Tap en portada → abrir en visor
          card.addEventListener('click', () => bovedaAbrirEnVisor(item, items));

          grid.appendChild(card);

          // Lazy load: solo cargar portada cuando la tarjeta entre al viewport
          if (_bvPortadas[item.id]) {
            img.src = _bvPortadas[item.id];
            img.style.display = 'block';
            placeholder.style.display = 'none';
          } else {
            card._portadaLoader = async () => {
              try {
                let blob = await bvCargarPortada(item.id);
                if (!blob) {
                  const reg = await bvCargar(item.id);
                  if (!reg) return;
                  blob = await bvExtraerPortada(reg.blob);
                  if (!blob) return;
                  bvGuardarPortada(item.id, blob).catch(() => {});
                }
                const url = URL.createObjectURL(blob);
                _bvPortadas[item.id] = url;
                img.src = url;
                img.style.display = 'block';
                placeholder.style.display = 'none';
              } catch(e) {}
            };
            _bvObserver.observe(card);
          }
        }
      }


      // — Abrir ZIP de bóveda en el Visor —
      async function bovedaAbrirEnVisor(item, todos) {
        try {
          const id = typeof item === 'number' ? item : item.id;
          actualizarStatus('⏳ Cargando desde bóveda…');
          const registro = await bvCargar(id);
          if (!registro) { actualizarStatus('❌ Archivo no encontrado'); return; }
          archivosDescargados.length = 0;
          const zip      = await JSZip.loadAsync(registro.blob);
          const entradas = Object.values(zip.files)
          .filter(f => !f.dir)
          .sort((a,b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
          for (const entrada of entradas) {
            const blob = await entrada.async('blob');
            archivosDescargados.push({ nombre: entrada.name, blob });
          }
          // Contexto para navegación entre mangas
          if (todos && typeof item === 'object') {
            _visorContexto = { tipo: 'mangas', galeria: item, galerias: todos };
          } else {
            _visorContexto = null;
          }
          bvNavegar('pantalla1');
          mostrarImagenesEnVisor();
          actualizarStatus('✅ ' + entradas.length + ' imágenes cargadas');
        } catch(err) {
          actualizarStatus('❌ Error: ' + err.message);
        }
      }

      // — Descargar ZIP desde bóveda —
      async function bovedaDescargar(id, nombre) {
        try {
          const registro = await bvCargar(id);
          if (!registro) return;
          const url = URL.createObjectURL(registro.blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = nombre;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
        } catch(err) {
          actualizarStatus('❌ Error al descargar: ' + err.message);
        }
      }

      // — Eliminar de bóveda —
      async function bvEliminar(id, cardEl) {
        if (!confirm('¿Eliminar este ZIP de la Bóveda? No se puede deshacer.')) return;
        try {
          await bvEliminarDB(id);
          bvEliminarPortada(id).catch(() => {});
          delete _bvPortadas[id];
          cardEl.style.opacity = '0';
          cardEl.style.transform = 'translateX(20px)';
          setTimeout(() => {
            cardEl.remove();
            const lista = document.getElementById('bvLista');
            if (!lista.querySelector('.bv-cover-card')) {
              lista.innerHTML = '<div class="bv-empty">🏛️ Bóveda vacía<br><span style="font-size:.8rem">Agrega tu primer manga</span></div>';
            }
          }, 300);
        } catch(err) {
          actualizarStatus('❌ Error: ' + err.message);
        }
      }


      /* =============================================
         10. INIT
      ============================================= */

      document.addEventListener("DOMContentLoaded", () => {
        // Frame visible, pantalla1 visible, pantalla3 y visor ocultos
        document.getElementById('frameMain').style.display = 'block';
        document.getElementById('pantalla1').style.display = 'block';
        document.getElementById('pantalla3').style.display = 'none';
        document.getElementById('pantalla2').style.display = 'none';
        cargarLinksLocal();
      });

    </script>



  </body>
